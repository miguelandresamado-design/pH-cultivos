<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#253b28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="pH Cultivos">
  <link rel="manifest" href="manifest.json">
  <title>pH Cultivos</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f4;color:#1f2a1f;min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
    .wrap{max-width:460px;margin:auto}.app{background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.09)}
    .eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#778077;font-weight:700;margin-bottom:6px}
    h1{margin:0;font-size:30px}.subtitle{margin:6px 0 24px;color:#697269}
    label{display:block;margin-bottom:8px;font-weight:750}
    select,input{width:100%;padding:16px;border:1px solid #ccd4cc;border-radius:14px;font-size:20px;background:#fff;color:#162016}
    select{margin-bottom:20px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#253b28 50%),linear-gradient(135deg,#253b28 50%,transparent 50%);background-position:calc(100% - 21px) 50%,calc(100% - 15px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
    input{font-size:24px}
    button{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:800;background:#253b28;color:#fff;cursor:pointer;touch-action:manipulation}
    .result{display:none;margin-top:26px;border-top:1px solid #e7ebe7;padding-top:24px}
    .value{text-align:center;font-size:58px;line-height:1;font-weight:850}.unit{text-align:center;color:#758075;margin-top:4px;font-size:14px}
    .status{margin:14px auto 22px;width:fit-content;padding:10px 22px;border-radius:999px;font-weight:850;letter-spacing:.04em;text-align:center}
    .very-low{background:#a71920;color:#fff}.low{background:#ffd7d1;color:#8a241b}.adequate{background:#dff1da;color:#27652b}.moderately-high{background:#dce8ff;color:#204f98}.high{background:#173b91;color:#fff}
    .scale{position:relative;margin-top:18px;padding-top:13px}.bar{height:36px;border-radius:999px;background:linear-gradient(90deg,#b5121b 0%,#ef5d50 24%,#83c878 50%,#43b6c5 74%,#2454bd 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
    .marker{position:absolute;top:0;width:4px;height:50px;background:#111;border-radius:3px;transform:translateX(-50%);transition:left .25s ease;pointer-events:none}
    .marker:before{content:"";position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:#111;border-radius:50%}
    .scale-ticks{position:relative;height:20px;margin-top:9px;color:#758075;font-size:11px}.scale-ticks span{position:absolute;transform:translateX(-50%)}
    .labels{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:2px;color:#667066;font-size:9px;font-weight:750;text-align:center;line-height:1.15}.labels span{min-width:0}
    .message{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fafbfa;border:1px solid #e6eae6;line-height:1.5}
    .ranges{margin-top:18px;background:#f5f7f5;border-radius:16px;padding:16px;line-height:1.7;font-size:15px}
    .foot{text-align:center;margin-top:16px;color:#818981;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <main class="app">
    <div class="eyebrow">Cultivo</div>
    <h1 id="crop-title">Café</h1>
    <p class="subtitle">Interpretador básico de pH</p>
    <label for="crop">Seleccionar cultivo</label>
    <select id="crop">
      <option value="cafe">Café</option>
      <option value="banano">Banano</option>
    </select>
    <label for="ph">pH medido</label>
    <input id="ph" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej. 5,6">
    <button id="interpretar" type="button">Interpretar lectura</button>
    <section id="result" class="result" aria-live="polite">
      <div id="value" class="value">5.6</div>
      <div class="unit">pH</div>
      <div id="status" class="status adequate">ADECUADO</div>
      <div class="scale">
        <div id="bar" class="bar" aria-label="Escala continua de pH: rojo para valores bajos, verde para adecuados y azul para altos"></div>
        <div class="marker" id="marker"></div>
        <div id="scale-ticks" class="scale-ticks"></div>
        <div class="labels"><span>MUY<br>BAJO</span><span>BAJO</span><span>ADECUADO</span><span>MOD.<br>ALTO</span><span>ALTO</span></div>
      </div>
      <div id="message" class="message"></div>
      <div id="ranges" class="ranges"></div>
    </section>
  </main>
  <div class="foot">Versión 3.2 · Café y Banano · Escala continua</div>
</div>
<script>
(function(){
  const crops={
    cafe:{
      name:'Café',
      source:'Cenicafé',
      scaleMin:4,
      scaleMax:6.5,
      bands:[
        {max:4.5,label:'MUY BAJO',className:'very-low',description:'El pH indica una condición de acidez crítica para Café.'},
        {max:5,label:'BAJO',className:'low',description:'El pH se encuentra por debajo del rango adecuado para Café.'},
        {max:5.5,label:'ADECUADO',className:'adequate',description:'El pH se encuentra dentro del rango adecuado para Café.'},
        {max:6,label:'MODERADAMENTE ALTO',className:'moderately-high',description:'El pH se encuentra por encima del rango adecuado para Café.'},
        {max:Infinity,label:'ALTO',className:'high',description:'El pH se encuentra en el rango alto definido para Café.'}
      ]
    },
    banano:{
      name:'Banano',
      scaleMin:4.2,
      scaleMax:8.1,
      bands:[
        {max:5,label:'MUY BAJO',className:'very-low',description:'El pH indica una condición de acidez crítica para Banano.'},
        {max:5.8,label:'BAJO',className:'low',description:'El pH se encuentra por debajo del rango adecuado para Banano.'},
        {max:6.54,label:'ADECUADO',className:'adequate',description:'El pH se encuentra dentro del rango adecuado para Banano.'},
        {max:7.3,label:'MODERADAMENTE ALTO',className:'moderately-high',description:'El pH se encuentra por encima del rango adecuado para Banano.'},
        {max:Infinity,label:'ALTO',className:'high',description:'El pH se encuentra en el rango alto definido para Banano.'}
      ]
    }
  };
  const cropSelect=document.getElementById('crop');
  const cropTitle=document.getElementById('crop-title');
  const input=document.getElementById('ph');
  const button=document.getElementById('interpretar');
  const result=document.getElementById('result');
  const value=document.getElementById('value');
  const status=document.getElementById('status');
  const marker=document.getElementById('marker');
  const scaleTicks=document.getElementById('scale-ticks');
  const message=document.getElementById('message');
  const ranges=document.getElementById('ranges');

  function displayNumber(number){return number.toFixed(2).replace('.',',');}
  function displayPh(number){return number.toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:2});}
  function scalePosition(crop,ph){return Math.max(0,Math.min(100,((ph-crop.scaleMin)/(crop.scaleMax-crop.scaleMin))*100));}

  function bandRange(crop,index){
    const lower=index===0?null:crop.bands[index-1].max;
    const upper=crop.bands[index].max;
    if(lower===null)return `menor de ${displayNumber(upper)}`;
    if(upper===Infinity)return `${displayNumber(lower)} o mayor`;
    return `de ${displayNumber(lower)} a menos de ${displayNumber(upper)}`;
  }

  function updateCrop(){
    const crop=crops[cropSelect.value];
    cropTitle.textContent=crop.name;
    ranges.innerHTML=crop.bands.map((band,index)=>`<div><strong>${band.label}:</strong> ${bandRange(crop,index)}</div>`).join('');
    scaleTicks.replaceChildren();
    crop.bands.slice(0,-1).forEach(band=>{
      const tick=document.createElement('span');
      tick.textContent=displayNumber(band.max);
      tick.style.left=scalePosition(crop,band.max)+'%';
      scaleTicks.appendChild(tick);
    });
    result.style.display='none';
  }

  function interpretar(){
    const ph=Number(String(input.value).trim().replace(',','.'));
    if(!Number.isFinite(ph)||ph<0||ph>14){alert('Ingrese un valor de pH válido entre 0 y 14.');input.focus();return;}
    const crop=crops[cropSelect.value];
    const bandIndex=crop.bands.findIndex(band=>ph<band.max);
    const band=crop.bands[bandIndex];
    value.textContent=displayPh(ph);status.className='status';
    status.textContent=band.label;status.classList.add(band.className);message.textContent=band.description;
    marker.style.left=scalePosition(crop,ph)+'%';result.style.display='block';
  }

  cropSelect.addEventListener('change',updateCrop);
  button.addEventListener('click',interpretar);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')interpretar();});
  updateCrop();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').then(registration=>registration.update()).catch(()=>{}));}
})();
</script>
</body>
</html>
