<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#253b28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="pH Cultivos">
  <link rel="manifest" href="manifest.json">
  <title>pH Cultivos</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f4;color:#1f2a1f;min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
    .wrap{max-width:460px;margin:auto}.app{background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.09)}
    .eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#778077;font-weight:700;margin-bottom:6px}
    h1{margin:0;font-size:30px}.subtitle{margin:6px 0 24px;color:#697269}
    label{display:block;margin-bottom:8px;font-weight:750}
    select,input{width:100%;padding:16px;border:1px solid #ccd4cc;border-radius:14px;font-size:20px;background:#fff;color:#162016}
    select{margin-bottom:20px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#253b28 50%),linear-gradient(135deg,#253b28 50%,transparent 50%);background-position:calc(100% - 21px) 50%,calc(100% - 15px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
    input{font-size:24px}
    button{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:800;background:#253b28;color:#fff;cursor:pointer;touch-action:manipulation}
    .result{display:none;margin-top:26px;border-top:1px solid #e7ebe7;padding-top:24px}
    .value{text-align:center;font-size:58px;line-height:1;font-weight:850}.unit{text-align:center;color:#758075;margin-top:4px;font-size:14px}
    .status{margin:14px auto 22px;width:fit-content;padding:10px 22px;border-radius:999px;font-weight:850;letter-spacing:.04em;text-align:center}
    .very-low{background:#a71920;color:#fff}.low{background:#ffd7d1;color:#8a241b}.adequate{background:#dff1da;color:#27652b}.moderately-high{background:#dce8ff;color:#204f98}.high{background:#173b91;color:#fff}
    .scale{position:relative;margin-top:18px;padding-top:13px}.bar{height:36px;border-radius:999px;background:linear-gradient(90deg,#b5121b 0%,#ef5d50 24%,#83c878 50%,#43b6c5 74%,#2454bd 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
    .marker{position:absolute;top:0;width:4px;height:50px;background:#111;border-radius:3px;transform:translateX(-50%);transition:left .25s ease;pointer-events:none}
    .marker:before{content:"";position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:#111;border-radius:50%}
    .scale-ticks{position:relative;height:20px;margin-top:9px;color:#758075;font-size:11px}.scale-ticks span{position:absolute;transform:translateX(-50%)}
    .labels{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:2px;color:#667066;font-size:9px;font-weight:750;text-align:center;line-height:1.15}.labels span{min-width:0}
    .message{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fafbfa;border:1px solid #e6eae6;line-height:1.5}
    .ranges{margin-top:18px;background:#f5f7f5;border-radius:16px;padding:16px;line-height:1.7;font-size:15px}
    .location-panel{margin-top:14px;padding:14px;border:1px solid #dce4dc;border-radius:14px;background:#fbfcfb}.location-button{margin:0;background:#fff;color:#253b28;border:1px solid #bfcbbf}.location-button:disabled{opacity:.6;cursor:default}.location-feedback{min-height:18px;margin-top:9px;color:#697269;font-size:13px;line-height:1.4}.location-feedback.success{color:#27703a}.location-feedback.error{color:#8a2e20}
    .save-button{background:#eef4ee;color:#253b28;border:1px solid #cfd9cf}.save-button:disabled{opacity:.55;cursor:default}
    .save-feedback{min-height:20px;margin-top:8px;text-align:center;color:#47704a;font-size:13px}
    .history{margin-top:22px;border-top:1px solid #e7ebe7;padding-top:18px}.history summary{cursor:pointer;font-weight:800;list-style:none;display:flex;justify-content:space-between;align-items:center}.history summary::-webkit-details-marker{display:none}.history-count{min-width:28px;padding:4px 9px;border-radius:999px;background:#edf1ed;text-align:center;font-size:13px}
    .history-empty{padding:18px 0 4px;color:#758075;font-size:14px}.history-list{margin-top:12px}.history-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 0;border-top:1px solid #edf0ed}.history-main{min-width:0}.history-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.history-ph{font-size:20px;font-weight:800}.history-status{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:850}.history-meta{margin-top:5px;color:#758075;font-size:12px}.history-location{display:inline-block;margin-top:6px;color:#315f91;font-size:12px;font-weight:700;text-decoration:none}.history-location:focus,.history-location:hover{text-decoration:underline}.delete-button{width:auto;margin:0;align-self:center;padding:8px 10px;border:1px solid #e2c6c2;background:#fff;color:#8a2e20;border-radius:10px;font-size:12px;font-weight:750}
    .foot{text-align:center;margin-top:16px;color:#818981;font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <main class="app">
    <div class="eyebrow">Cultivo</div>
    <h1 id="crop-title">Café</h1>
    <p class="subtitle">Interpretador básico de pH</p>
    <label for="crop">Seleccionar cultivo</label>
    <select id="crop">
      <option value="cafe">Café</option>
      <option value="banano">Banano</option>
    </select>
    <label for="ph">pH medido</label>
    <input id="ph" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej. 5,6">
    <button id="interpretar" type="button">Interpretar lectura</button>
    <section id="result" class="result" aria-live="polite">
      <div id="value" class="value">5.6</div>
      <div class="unit">pH</div>
      <div id="status" class="status adequate">ADECUADO</div>
      <div class="scale">
        <div id="bar" class="bar" aria-label="Escala continua de pH: rojo para valores bajos, verde para adecuados y azul para altos"></div>
        <div class="marker" id="marker"></div>
        <div id="scale-ticks" class="scale-ticks"></div>
        <div class="labels"><span>MUY<br>BAJO</span><span>BAJO</span><span>ADECUADO</span><span>MOD.<br>ALTO</span><span>ALTO</span></div>
      </div>
      <div id="message" class="message"></div>
      <div id="ranges" class="ranges"></div>
      <div class="location-panel">
        <button id="add-location" class="location-button" type="button">Agregar ubicación</button>
        <div id="location-feedback" class="location-feedback" aria-live="polite">Opcional. El permiso se solicitará únicamente al pulsar el botón.</div>
      </div>
      <button id="save-measurement" class="save-button" type="button">Guardar medición</button>
      <div id="save-feedback" class="save-feedback" aria-live="polite"></div>
    </section>
    <details id="history" class="history">
      <summary>Historial local <span id="history-count" class="history-count">0</span></summary>
      <div id="history-empty" class="history-empty">Aún no hay mediciones guardadas.</div>
      <div id="history-list" class="history-list"></div>
    </details>
  </main>
  <div class="foot">Versión 3.4 · Ubicación opcional · Lectura manual</div>
</div>
<script>
(function(){
  const crops={
    cafe:{
      name:'Café',
      source:'Cenicafé',
      scaleMin:4,
      scaleMax:6.5,
      bands:[
        {max:4.5,label:'MUY BAJO',className:'very-low',description:'El pH indica una condición de acidez crítica para Café.'},
        {max:5,label:'BAJO',className:'low',description:'El pH se encuentra por debajo del rango adecuado para Café.'},
        {max:5.5,label:'ADECUADO',className:'adequate',description:'El pH se encuentra dentro del rango adecuado para Café.'},
        {max:6,label:'MODERADAMENTE ALTO',className:'moderately-high',description:'El pH se encuentra por encima del rango adecuado para Café.'},
        {max:Infinity,label:'ALTO',className:'high',description:'El pH se encuentra en el rango alto definido para Café.'}
      ]
    },
    banano:{
      name:'Banano',
      scaleMin:4.2,
      scaleMax:8.1,
      bands:[
        {max:5,label:'MUY BAJO',className:'very-low',description:'El pH indica una condición de acidez crítica para Banano.'},
        {max:5.8,label:'BAJO',className:'low',description:'El pH se encuentra por debajo del rango adecuado para Banano.'},
        {max:6.54,label:'ADECUADO',className:'adequate',description:'El pH se encuentra dentro del rango adecuado para Banano.'},
        {max:7.3,label:'MODERADAMENTE ALTO',className:'moderately-high',description:'El pH se encuentra por encima del rango adecuado para Banano.'},
        {max:Infinity,label:'ALTO',className:'high',description:'El pH se encuentra en el rango alto definido para Banano.'}
      ]
    }
  };
  const cropSelect=document.getElementById('crop');
  const cropTitle=document.getElementById('crop-title');
  const input=document.getElementById('ph');
  const button=document.getElementById('interpretar');
  const result=document.getElementById('result');
  const value=document.getElementById('value');
  const status=document.getElementById('status');
  const marker=document.getElementById('marker');
  const scaleTicks=document.getElementById('scale-ticks');
  const message=document.getElementById('message');
  const ranges=document.getElementById('ranges');
  const locationButton=document.getElementById('add-location');
  const locationFeedback=document.getElementById('location-feedback');
  const saveButton=document.getElementById('save-measurement');
  const saveFeedback=document.getElementById('save-feedback');
  const historyPanel=document.getElementById('history');
  const historyCount=document.getElementById('history-count');
  const historyEmpty=document.getElementById('history-empty');
  const historyList=document.getElementById('history-list');
  const STORE_KEY='ph-cultivos.measurements.v1';
  let currentMeasurement=null;
  let currentLocation=null;
  let measurements=[];

  function displayNumber(number){return number.toFixed(2).replace('.',',');}
  function displayPh(number){return number.toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:2});}
  function scalePosition(crop,ph){return Math.max(0,Math.min(100,((ph-crop.scaleMin)/(crop.scaleMax-crop.scaleMin))*100));}

  function bandRange(crop,index){
    const lower=index===0?null:crop.bands[index-1].max;
    const upper=crop.bands[index].max;
    if(lower===null)return `menor de ${displayNumber(upper)}`;
    if(upper===Infinity)return `${displayNumber(lower)} o mayor`;
    return `de ${displayNumber(lower)} a menos de ${displayNumber(upper)}`;
  }

  function loadMeasurements(){
    try{
      const stored=JSON.parse(localStorage.getItem(STORE_KEY));
      measurements=stored&&stored.schemaVersion===1&&Array.isArray(stored.measurements)?stored.measurements:[];
    }catch(error){measurements=[];}
  }

  function persistMeasurements(){
    localStorage.setItem(STORE_KEY,JSON.stringify({schemaVersion:1,measurements}));
  }

  function recordId(){
    return globalThis.crypto&&typeof globalThis.crypto.randomUUID==='function'?globalThis.crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function formatDate(isoDate){
    const date=new Date(isoDate);
    return Number.isNaN(date.getTime())?'Fecha no disponible':new Intl.DateTimeFormat('es-CO',{dateStyle:'short',timeStyle:'short'}).format(date);
  }

  function validLocation(location){
    return location&&Number.isFinite(location.latitude)&&Number.isFinite(location.longitude);
  }

  function resetLocation(){
    currentLocation=null;
    locationFeedback.className='location-feedback';
    if(!('geolocation' in navigator)){
      locationButton.disabled=true;
      locationButton.textContent='Ubicación no disponible';
      locationFeedback.textContent='Este dispositivo no permite obtener la ubicación. Puedes guardar sin ella.';
      return;
    }
    locationButton.disabled=false;
    locationButton.textContent='Agregar ubicación';
    locationFeedback.textContent='Opcional. El permiso se solicitará únicamente al pulsar el botón.';
  }

  function locationErrorMessage(error){
    if(error&&error.code===1)return 'Permiso de ubicación no concedido. Puedes guardar sin ubicación.';
    if(error&&error.code===2)return 'No fue posible determinar la ubicación. Intenta nuevamente al aire libre.';
    if(error&&error.code===3)return 'La ubicación tardó demasiado. Puedes intentarlo nuevamente.';
    return 'No fue posible obtener la ubicación. Puedes guardar sin ella.';
  }

  function captureLocation(){
    if(!currentMeasurement||!('geolocation' in navigator))return;
    const requestedMeasurement=currentMeasurement;
    locationButton.disabled=true;
    locationButton.textContent='Obteniendo ubicación…';
    locationFeedback.className='location-feedback';
    locationFeedback.textContent='Esperando la ubicación del teléfono.';
    saveButton.disabled=true;
    navigator.geolocation.getCurrentPosition(position=>{
      if(currentMeasurement!==requestedMeasurement)return;
      currentLocation={
        latitude:position.coords.latitude,
        longitude:position.coords.longitude,
        accuracy:position.coords.accuracy,
        capturedAt:new Date().toISOString()
      };
      locationButton.disabled=false;
      locationButton.textContent='Actualizar ubicación';
      locationFeedback.className='location-feedback success';
      locationFeedback.textContent=`Ubicación agregada · precisión aproximada ±${Math.round(currentLocation.accuracy)} m.`;
      saveButton.disabled=false;
    },error=>{
      if(currentMeasurement!==requestedMeasurement)return;
      currentLocation=null;
      locationButton.disabled=false;
      locationButton.textContent='Intentar ubicación nuevamente';
      locationFeedback.className='location-feedback error';
      locationFeedback.textContent=locationErrorMessage(error);
      saveButton.disabled=false;
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  }

  function renderHistory(){
    historyCount.textContent=String(measurements.length);
    historyEmpty.style.display=measurements.length?'none':'block';
    historyList.replaceChildren();
    measurements.forEach(measurement=>{
      const item=document.createElement('div');
      item.className='history-item';
      const main=document.createElement('div');
      main.className='history-main';
      const line=document.createElement('div');
      line.className='history-line';
      const ph=document.createElement('span');
      ph.className='history-ph';
      ph.textContent=`${displayPh(measurement.ph)} pH`;
      const category=document.createElement('span');
      category.className=`history-status ${measurement.className}`;
      category.textContent=measurement.category;
      const meta=document.createElement('div');
      meta.className='history-meta';
      meta.textContent=`${measurement.cropName} · ${formatDate(measurement.recordedAt)}`;
      let locationLink=null;
      if(validLocation(measurement.location)){
        locationLink=document.createElement('a');
        locationLink.className='history-location';
        locationLink.target='_blank';
        locationLink.rel='noopener';
        locationLink.href=`https://www.google.com/maps/search/?api=1&query=${measurement.location.latitude},${measurement.location.longitude}`;
        const accuracy=Number.isFinite(measurement.location.accuracy)?` · ±${Math.round(measurement.location.accuracy)} m`:'';
        locationLink.textContent=`Ver ubicación${accuracy}`;
      }
      const deleteButton=document.createElement('button');
      deleteButton.type='button';
      deleteButton.className='delete-button';
      deleteButton.textContent='Eliminar';
      deleteButton.setAttribute('aria-label',`Eliminar medición de ${measurement.cropName} con pH ${displayPh(measurement.ph)}`);
      deleteButton.addEventListener('click',()=>deleteMeasurement(measurement.id));
      line.append(ph,category);
      main.append(line,meta);
      if(locationLink)main.appendChild(locationLink);
      item.append(main,deleteButton);
      historyList.appendChild(item);
    });
  }

  function saveMeasurement(){
    if(!currentMeasurement)return;
    const measurement={...currentMeasurement,id:recordId(),recordedAt:new Date().toISOString(),source:'manual',location:validLocation(currentLocation)?{...currentLocation}:null};
    try{
      measurements.unshift(measurement);
      persistMeasurements();
      renderHistory();
      saveButton.disabled=true;
      saveButton.textContent='Medición guardada';
      locationButton.disabled=true;
      saveFeedback.textContent=measurement.location?'Guardada localmente con ubicación.':'Guardada localmente sin ubicación.';
      historyPanel.open=true;
    }catch(error){
      measurements.shift();
      saveButton.disabled=false;
      saveButton.textContent='Guardar medición';
      locationButton.disabled=false;
      alert('No fue posible guardar la medición en este dispositivo.');
    }
  }

  function deleteMeasurement(id){
    if(!confirm('¿Eliminar esta medición del historial local?'))return;
    const previous=measurements;
    measurements=measurements.filter(measurement=>measurement.id!==id);
    try{persistMeasurements();renderHistory();}
    catch(error){measurements=previous;alert('No fue posible eliminar la medición.');}
  }

  function updateCrop(){
    const crop=crops[cropSelect.value];
    cropTitle.textContent=crop.name;
    ranges.innerHTML=crop.bands.map((band,index)=>`<div><strong>${band.label}:</strong> ${bandRange(crop,index)}</div>`).join('');
    scaleTicks.replaceChildren();
    crop.bands.slice(0,-1).forEach(band=>{
      const tick=document.createElement('span');
      tick.textContent=displayNumber(band.max);
      tick.style.left=scalePosition(crop,band.max)+'%';
      scaleTicks.appendChild(tick);
    });
    currentMeasurement=null;
    resetLocation();
    saveButton.disabled=false;
    saveButton.textContent='Guardar medición';
    saveFeedback.textContent='';
    result.style.display='none';
  }

  function interpretar(){
    const ph=Number(String(input.value).trim().replace(',','.'));
    if(!Number.isFinite(ph)||ph<0||ph>14){alert('Ingrese un valor de pH válido entre 0 y 14.');input.focus();return;}
    const crop=crops[cropSelect.value];
    const bandIndex=crop.bands.findIndex(band=>ph<band.max);
    const band=crop.bands[bandIndex];
    value.textContent=displayPh(ph);status.className='status';
    status.textContent=band.label;status.classList.add(band.className);message.textContent=band.description;
    currentMeasurement={cropId:cropSelect.value,cropName:crop.name,ph,category:band.label,className:band.className};
    resetLocation();
    saveButton.disabled=false;
    saveButton.textContent='Guardar medición';
    saveFeedback.textContent='';
    marker.style.left=scalePosition(crop,ph)+'%';result.style.display='block';
  }

  cropSelect.addEventListener('change',updateCrop);
  button.addEventListener('click',interpretar);
  locationButton.addEventListener('click',captureLocation);
  saveButton.addEventListener('click',saveMeasurement);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')interpretar();});
  input.addEventListener('input',()=>{currentMeasurement=null;resetLocation();result.style.display='none';});
  loadMeasurements();
  renderHistory();
  updateCrop();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').then(registration=>registration.update()).catch(()=>{}));}
})();
</script>
</body>
</html>
